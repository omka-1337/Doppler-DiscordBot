services:
  bot:
    build: .
    container_name: doppler_discord_bot
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - broker

  web:
    build: .
    container_name: doppler_web_dashboard
    restart: unless-stopped
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - bot

  # Starts the sidecar containers plugins declare in their manifests (Lavalink,
  # for the music plugin). This is the only container with access to the Docker
  # socket -- the bot, which runs plugin code, deliberately has none. It reads
  # the manifests itself from a read-only mount of the project, so it never
  # takes a container specification from its caller.
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    container_name: doppler_service_broker
    restart: unless-stopped
    environment:
      # Bind mounts are resolved by the daemon on the host, so the broker needs
      # to know where this project lives from the host's point of view.
      - HOST_PROJECT_DIR=${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    expose:
      - "8002"
